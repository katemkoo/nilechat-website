<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075EFD">

  <title>NileChat | نايل شات</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f6f9ff;
      color: #172033;
      line-height: 1.7;
    }

    header {
      background: rgba(255,255,255,.95);
      padding: 16px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 14px rgba(0,0,0,.05);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #075EFD;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin-right: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      background:
        radial-gradient(circle at 20% 20%, #d8eaff 0, transparent 30%),
        linear-gradient(145deg, #f8fbff, #edf5ff);
    }

    .hero-content {
      max-width: 760px;
    }

    .app-icon {
      width: 100px;
      height: 100px;
      margin: auto auto 25px;
      border-radius: 28px;
      background: linear-gradient(135deg, #1688ff, #075EFD);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 15px 35px rgba(7,94,253,.25);
    }

    h1 {
      font-size: clamp(38px, 8vw, 70px);
      color: #075EFD;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 21px;
      color: #475569;
      margin-bottom: 12px;
    }

    .description {
      color: #64748b;
      max-width: 620px;
      margin: 0 auto 30px;
    }

    .download {
      display: inline-block;
      padding: 15px 34px;
      background: #075EFD;
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(7,94,253,.25);
    }

    .version {
      display: block;
      margin-top: 12px;
      color: #8490a5;
      font-size: 13px;
    }

    .features {
      padding: 70px 7%;
      text-align: center;
    }

    .features h2 {
      font-size: 32px;
      margin-bottom: 35px;
    }

    .cards {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 22px;
      box-shadow: 0 7px 25px rgba(0,0,0,.06);
    }

    .card .icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #718096;
      font-size: 14px;
    }

    footer {
      background: #0c1729;
      color: #aab4c4;
      text-align: center;
      padding: 30px 15px;
      margin-top: 30px;
    }

    footer strong {
      color: white;
    }

    @media(max-width: 700px) {
      nav {
        display: none;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 72vh;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NileChat</div>

  <nav>
    <a href="#home">الرئيسية</a>
    <a href="#features
